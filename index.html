<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Личный дашборд</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
:root{
  --bg:#EEF0FA; --card:#FFFFFF; --ink:#1F1B4D; --muted:#5C5A85; --tank:#DDE1F6; --liquid:#FFD24A;
  --accent:#3B36C9; --accent-ink:#FFFFFF; --bad:#C2264B; --good:#1E7B5A; --line:#D5D9EE; --shade:rgba(31,27,77,.45);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12112B; --card:#1C1A3F; --ink:#ECEBFF; --muted:#A9A7D6; --tank:#232150; --liquid:#3B36C9;
    --accent:#FFD24A; --accent-ink:#1F1B4D; --bad:#FF8FA3; --good:#6FDDB4; --line:#2E2B5E; --shade:rgba(5,4,20,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12112B; --card:#1C1A3F; --ink:#ECEBFF; --muted:#A9A7D6; --tank:#232150; --liquid:#3B36C9;
  --accent:#FFD24A; --accent-ink:#1F1B4D; --bad:#FF8FA3; --good:#6FDDB4; --line:#2E2B5E; --shade:rgba(5,4,20,.65);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:460px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:12px}
.top h1{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em}
.top .date{color:var(--muted);font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}

.tank{position:relative;height:270px;border-radius:32px;background:var(--tank);overflow:hidden;isolation:isolate}
.liquid{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--liquid);transition:height .7s cubic-bezier(.2,.8,.2,1);z-index:-1}
.wave{position:absolute;left:0;bottom:calc(100% - 1px);width:200%;height:14px;color:var(--liquid);animation:slide 7s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.tank-in{position:absolute;inset:0;padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.tank-label{font-size:15px;font-weight:600}
.tank-sum{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:clamp(40px,13vw,58px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.tank-note{font-size:14px;font-weight:500;margin-top:8px}
.tank.over .tank-sum,.tank.over .tank-label{color:var(--bad)}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:var(--card);border-radius:20px;padding:14px 16px}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:18px;white-space:nowrap}

h2{font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:16px;margin:28px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 button{font-family:"Golos Text",sans-serif;font-size:14px;font-weight:600;color:var(--accent);min-height:44px;padding:0 4px}
.list{background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:60px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted)}
.row .s.late{color:var(--bad);font-weight:600}
.row .s.now{color:var(--good);font-weight:600}
.row .amt{font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:14px;white-space:nowrap}
.chip-btn{min-height:40px;padding:0 14px;border-radius:12px;background:var(--bg);font-size:14px;font-weight:600;white-space:nowrap}
.chip-btn.primary{background:var(--accent);color:var(--accent-ink)}
.x-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x-btn svg{width:18px;height:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{padding:20px 16px;color:var(--muted);font-size:15px}
.quiet{color:var(--muted);font-size:14px;margin-top:24px}

.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;background:var(--card);border-radius:20px;padding:16px 14px 10px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--tank);min-height:4px}
.bar.today i{background:var(--accent)}
.bar span{font-size:12px;color:var(--muted)}
.bar.today span{color:var(--ink);font-weight:700}
.sleepcard{background:var(--card);border-radius:20px;padding:14px 16px}
.sleepcard .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sleepcard .head span{color:var(--muted);font-size:13px}
.sleepcard .head b{font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:18px;white-space:nowrap}
.sleepcard .bars{background:none;border-radius:0;padding:10px 0 0;height:104px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{min-height:44px;border-radius:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.check{width:28px;height:28px;border-radius:9px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.check.on{background:var(--good);border-color:var(--good);color:var(--card)}
.check svg{width:16px;height:16px}
.done .t{text-decoration:line-through;color:var(--muted)}
.wide-btn{display:block;width:100%;min-height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;margin-top:14px}
.wide-btn.ghost{background:var(--card);color:var(--ink)}
.wide-btn:disabled{opacity:.45;cursor:default}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.fab{width:64px;height:64px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 8px 20px var(--shade)}
.fab svg{width:28px;height:28px}

.shade{position:fixed;inset:0;background:var(--shade);display:none;align-items:flex-end;justify-content:center;z-index:10}
.shade.open{display:flex}
.sheet{width:100%;max-width:460px;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:18px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{min-height:120px;border-radius:24px;background:var(--card);font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:17px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px;text-align:left}
.choice button small{font-family:"Golos Text",sans-serif;font-size:13px;font-weight:500;color:var(--muted)}
.amount{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:44px;text-align:center;letter-spacing:-.02em;margin:4px 0 12px;min-height:56px;white-space:nowrap}
.amount.zero{color:var(--muted)}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.cats button{min-height:44px;padding:0 16px;border-radius:14px;background:var(--card);font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--liquid);color:#1F1B4D}
:root[data-theme="dark"] .cats button[aria-pressed="true"]{color:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cats button[aria-pressed="true"]{color:#FFFFFF}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:58px;border-radius:16px;background:var(--card);font-family:"Unbounded","Golos Text",sans-serif;font-weight:500;font-size:22px}
.keys button svg{width:26px;height:26px;vertical-align:middle}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.inp{width:100%;min-height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:12px 14px}
textarea.inp{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.toast{position:fixed;left:50%;transform:translate(-50%,-20px);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.out .tabbar{display:none}
.auth{padding-top:8vh}
.auth h1{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;font-size:26px;margin:0 0 8px;letter-spacing:-.01em}
.auth p{color:var(--muted);margin:0 0 12px}
@media (prefers-reduced-motion: reduce){.wave,.sheet{animation:none}.liquid,.toast{transition:none}}
</style>
</head>
<body>
<main class="app" id="view"></main>

<nav class="tabbar" aria-label="Разделы">
  <button class="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>Сегодня</button>
  <button class="tab" data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Расходы</button>
  <button class="fab" data-act="open-menu" aria-label="Записать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l2-8h12l2 8v6H4z"/><path d="M4 13h5a3 3 0 0 0 6 0h5"/></svg>Входящие</button>
  <button class="tab" data-tab="duties"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Дела</button>
</nav>

<div class="shade" id="shade"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
const sb=window.supabase.createClient('https://yywkgdkptiqczwawdtlh.supabase.co','sb_publishable_0grulAtaLXdNYf47TEqSNQ_VOE9waya');
const CATS=['Еда','Транспорт','Дом','Здоровье','Отдых','Другое'];
const REPEAT={none:'один раз',week:'каждую неделю',month:'каждый месяц',halfyear:'раз в полгода',year:'раз в год'};
const DOW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>';

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const addMonths=(d,n)=>{const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x;};
const now=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const weekStart=d=>addDays(d,-((d.getDay()+6)%7));
const diffDays=(a,b)=>Math.round((a-b)/864e5);
const money=n=>Math.round(n).toLocaleString('ru-RU')+'\u00A0₽';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return (m>10&&m<20)?c:k===1?a:(k>1&&k<5)?b:c;};
const dayMonth=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});

let S={expenses:[],inbox:[],shop:[],duties:[]};
let user=null,loading=true,authMsg='',authEmail='';
async function loadAll(){
  const from=iso(addDays(now(),-62));
  const [e,i,s,d]=await Promise.all([
    sb.from('expenses').select('id,amount,category,spent_on').gte('spent_on',from).order('created_at',{ascending:false}),
    sb.from('inbox').select('id,text,created_at').order('created_at',{ascending:false}),
    sb.from('shopping').select('id,text,done').order('created_at',{ascending:false}),
    sb.from('duties').select('id,title,due,repeat_rule')]);
  const err=e.error||i.error||s.error||d.error;if(err)throw err;
  S={expenses:e.data.map(x=>({id:x.id,amount:Number(x.amount),cat:x.category,date:x.spent_on})),
     inbox:i.data.map(x=>({id:x.id,text:x.text,created:iso(new Date(x.created_at))})),
     shop:s.data.map(x=>({id:x.id,text:x.text,done:x.done})),
     duties:d.data.map(x=>({id:x.id,title:x.title,due:x.due,repeat:x.repeat_rule}))};
}
async function run(q){
  let failed=false;
  try{const r=await q;if(r.error)failed=true;}catch(e){failed=true;}
  if(failed){toast('Не сохранилось. Проверь связь и попробуй ещё раз');try{await loadAll();}catch(e){}render();}
}
function viewAuth(){
  return '<div class="auth"><h1>Личный дашборд</h1><p>Войди, чтобы записи сохранялись и были видны на всех твоих устройствах.</p><label class="f" for="em">Почта</label><input class="inp" type="email" id="em" autocomplete="email" value="'+esc(authEmail)+'"><label class="f" for="pw">Пароль</label><input class="inp" type="password" id="pw" autocomplete="current-password"><button class="wide-btn" data-act="sign-in">Войти</button><button class="wide-btn ghost" data-act="sign-up">Создать аккаунт</button>'+(authMsg?'<p class="hint" role="status">'+esc(authMsg)+'</p>':'')+'</div>';
}
function creds(){const em=document.getElementById('em').value.trim(),pw=document.getElementById('pw').value;authEmail=em;if(!em||pw.length<6){authMsg='Нужны почта и пароль не короче 6 символов.';render();return null;}return {email:em,password:pw};}
let tab='today',inboxTab='ideas',lastLevel=0,sheetMode=null,draft={};

function calc(){
  const t=now(),tISO=iso(t),wsISO=iso(weekStart(t)),msISO=iso(new Date(t.getFullYear(),t.getMonth(),1)),fromISO=iso(addDays(t,-14));
  let today=0,week=0,month=0;const days={};
  S.expenses.forEach(e=>{if(e.date===tISO)today+=e.amount;if(e.date>=wsISO)week+=e.amount;if(e.date>=msISO)month+=e.amount;if(e.date>=fromISO&&e.date<tISO)days[e.date]=(days[e.date]||0)+e.amount;});
  const k=Object.keys(days);const usual=k.length?k.reduce((a,d)=>a+days[d],0)/k.length:0;
  return {today,week,month,usual};
}
function dueInfo(d){
  const n=diffDays(parse(d.due),now());
  if(n<0)return {cls:'late',txt:'Просрочено на '+(-n)+' '+plural(-n,'день','дня','дней')};
  if(n===0)return {cls:'now',txt:'Сегодня'};
  if(n===1)return {cls:'',txt:'Завтра'};
  return {cls:'',txt:'Через '+n+' '+plural(n,'день','дня','дней')+', '+dayMonth(parse(d.due))};
}
const sortedDuties=()=>S.duties.slice().sort((a,b)=>a.due<b.due?-1:1);

function dutyRow(d){
  const i=dueInfo(d);
  return '<div class="row"><div class="main"><div class="t">'+esc(d.title)+'</div><div class="s '+i.cls+'">'+i.txt+'</div></div><button class="chip-btn primary" data-act="duty-done" data-id="'+d.id+'">Сделал</button></div>';
}

function viewToday(){
  const c=calc();const note=!c.usual?'Сравнение появится через пару дней записей':c.today>c.usual?'Больше обычного дня на '+money(c.today-c.usual):'Обычный день у тебя '+money(c.usual);
  const title=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const duties=sortedDuties().slice(0,3);
  let h='<div class="top"><div><h1>Сегодня</h1><div class="date">'+esc(title)+'</div></div><button class="icon-btn" data-act="open-settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>';
  h+='<div class="tank"><div class="liquid" id="liquid"><svg class="wave" viewBox="0 0 800 14" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 7Q50 0 100 7T200 7T300 7T400 7T500 7T600 7T700 7T800 7V14H0Z"/></svg></div><div class="tank-in"><div class="tank-label">Потрачено сегодня</div><div><div class="tank-sum">'+money(c.today)+'</div><div class="tank-note">'+note+'</div></div></div></div>';
  h+='<div class="pair"><div class="stat"><span>За неделю</span><b>'+money(c.week)+'</b></div><div class="stat"><span>За месяц</span><b>'+money(c.month)+'</b></div></div>';
  h+='<h2>Ближайшие дела<button data-tab="duties">Все дела</button></h2><div class="list">'+(duties.length?duties.map(dutyRow).join(''):'<div class="empty">Дел нет. Добавь первое в разделе «Дела».</div>')+'</div>';
  h+='<h2>Входящие<button data-tab="inbox">Разобрать</button></h2><div class="list">';
  h+=S.inbox.length?S.inbox.slice(0,2).map(x=>'<div class="row"><div class="main"><div class="t">'+esc(x.text)+'</div></div></div>').join('')+(S.inbox.length>2?'<div class="row"><div class="main"><div class="s">И ещё '+(S.inbox.length-2)+'</div></div></div>':''):'<div class="empty">Пусто. Нажми плюс и запиши мысль.</div>';
  const sl=[6.9,7.6,6.1,7.8,6.4,8.3,7.2];
  h+='</div><h2>Браслет</h2><div class="sleepcard"><div class="head"><span>Сон этой ночью</span><b>7 ч 12 мин</b></div><div class="bars">'+sl.map((v,i)=>{const d=addDays(now(),i-6);return '<div class="bar'+(i===6?' today':'')+'"><i style="height:'+Math.round(v/9*100)+'%"></i><span>'+DOW[(d.getDay()+6)%7]+'</span></div>';}).join('')+'</div></div><div class="pair"><div class="stat"><span>Шаги сегодня</span><b>8 240</b></div><div class="stat"><span>Сожжено за день</span><b>2 340 ккал</b></div></div><p class="quiet">В блоке «Браслет» пока пример цифр: браслет ещё не подключён.</p>';
  return h;
}

function viewSpend(){
  const t=now(),ws=weekStart(t),tISO=iso(t);const byDay=[];let max=1;
  for(let i=0;i<7;i++){const d=iso(addDays(ws,i));const s=S.expenses.filter(e=>e.date===d).reduce((a,e)=>a+e.amount,0);byDay.push({d,s});if(s>max)max=s;}
  let h='<div class="top"><div><h1>Расходы</h1><div class="date">С понедельника '+money(calc().week)+'</div></div></div>';
  h+='<div class="bars">'+byDay.map((x,i)=>'<div class="bar'+(x.d===tISO?' today':'')+'" title="'+money(x.s)+'"><i style="height:'+Math.round(x.s/max*100)+'%"></i><span>'+DOW[i]+'</span></div>').join('')+'</div>';
  const week=S.expenses.filter(e=>e.date>=iso(ws)).sort((a,b)=>a.date<b.date?1:-1);
  const cats={};week.forEach(e=>{cats[e.cat]=(cats[e.cat]||0)+e.amount;});
  const cl=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]);
  h+='<h2>По категориям</h2><div class="list">'+(cl.length?cl.map(k=>'<div class="row"><div class="main"><div class="t">'+esc(k)+'</div></div><div class="amt">'+money(cats[k])+'</div></div>').join(''):'<div class="empty">На этой неделе расходов нет.</div>')+'</div>';
  h+='<h2>Записи</h2><div class="list">'+(week.length?week.map(e=>'<div class="row"><div class="main"><div class="t">'+esc(e.cat)+'</div><div class="s">'+(e.date===tISO?'Сегодня':dayMonth(parse(e.date)))+'</div></div><div class="amt">'+money(e.amount)+'</div><button class="x-btn" data-act="exp-del" data-id="'+e.id+'" aria-label="Удалить расход">'+X+'</button></div>').join(''):'<div class="empty">Нажми плюс, чтобы записать первый расход.</div>')+'</div>';
  return h;
}

function viewInbox(){
  let h='<div class="top"><div><h1>Входящие</h1><div class="date">Записал сразу, разобрал потом</div></div></div>';
  h+='<div class="seg"><button data-act="inbox-tab" data-v="ideas" aria-pressed="'+(inboxTab==='ideas')+'">Мысли, '+S.inbox.length+'</button><button data-act="inbox-tab" data-v="shop" aria-pressed="'+(inboxTab==='shop')+'">Купить, '+S.shop.filter(x=>!x.done).length+'</button></div>';
  if(inboxTab==='ideas'){
    h+='<div class="list">'+(S.inbox.length?S.inbox.map(x=>{const age=diffDays(now(),parse(x.created));return '<div class="row"><div class="main"><div class="t">'+esc(x.text)+'</div>'+(age>=7?'<div class="s late">Висит '+age+' '+plural(age,'день','дня','дней')+'. Ещё нужно?</div>':'')+'<div class="actions"><button class="chip-btn primary" data-act="idea-done" data-id="'+x.id+'">Сделано</button><button class="chip-btn" data-act="idea-date" data-id="'+x.id+'">На дату</button><button class="chip-btn" data-act="idea-del" data-id="'+x.id+'">Удалить</button></div></div></div>';}).join(''):'<div class="empty">Всё разобрано. Новая мысль записывается через плюс.</div>')+'</div>';
  }else{
    h+='<div class="list">'+(S.shop.length?S.shop.map(x=>'<div class="row'+(x.done?' done':'')+'"><button class="check'+(x.done?' on':'')+'" data-act="shop-toggle" data-id="'+x.id+'" aria-label="'+(x.done?'Вернуть в список':'Отметить купленным')+'">'+(x.done?TICK:'')+'</button><div class="main"><div class="t">'+esc(x.text)+'</div></div><button class="x-btn" data-act="shop-del" data-id="'+x.id+'" aria-label="Удалить из списка">'+X+'</button></div>').join(''):'<div class="empty">Список пуст. Запиши мысль со слова «купить», и она попадёт сюда.</div>')+'</div>';
  }
  return h;
}

function viewDuties(){
  const l=sortedDuties();
  let h='<div class="top"><div><h1>Дела</h1><div class="date">Обязательства с датой и повтором</div></div></div>';
  h+='<div class="list">'+(l.length?l.map(d=>{const i=dueInfo(d);return '<div class="row"><div class="main"><div class="t">'+esc(d.title)+'</div><div class="s '+i.cls+'">'+i.txt+'</div><div class="s">Повтор: '+REPEAT[d.repeat]+'</div></div><button class="chip-btn primary" data-act="duty-done" data-id="'+d.id+'">Сделал</button><button class="x-btn" data-act="duty-del" data-id="'+d.id+'" aria-label="Удалить дело">'+X+'</button></div>';}).join(''):'<div class="empty">Дел нет. Добавь счётчики, страховку или врача.</div>')+'</div>';
  h+='<button class="wide-btn" data-act="open-duty">Добавить дело</button>';
  return h;
}

function render(){
  const v=document.getElementById('view');
  document.body.classList.toggle('out',!user);
  if(loading){v.innerHTML='<div class="empty">Загружаю…</div>';return;}
  if(!user){v.innerHTML=viewAuth();return;}
  v.innerHTML=tab==='today'?viewToday():tab==='spend'?viewSpend():tab==='inbox'?viewInbox():viewDuties();
  document.querySelectorAll('.tab').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  const liq=document.getElementById('liquid');
  if(liq){const c=calc();const lvl=c.usual>0?Math.min(1,c.today/c.usual):(c.today>0?.5:0);liq.style.height=(lastLevel*88)+'%';requestAnimationFrame(()=>requestAnimationFrame(()=>{liq.style.height=(lvl*88)+'%';}));lastLevel=lvl;}
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600);}

function head(title){return '<h3>'+title+'<button class="x-btn" data-act="close" aria-label="Закрыть">'+X+'</button></h3>';}
function repeatSelect(id,val){return '<label class="f" for="'+id+'">Повтор</label><select class="inp" id="'+id+'">'+Object.keys(REPEAT).map(k=>'<option value="'+k+'"'+(k===val?' selected':'')+'>'+REPEAT[k]+'</option>').join('')+'</select>';}
function sheetHTML(){
  if(sheetMode==='menu')return head('Что записать?')+'<div class="choice"><button data-act="open-expense">Расход<small>Сумма и категория</small></button><button data-act="open-thought">Мысль<small>Задача, идея или «купить…»</small></button></div><p class="hint">В настоящей версии это окно открывается тройным стуком по задней крышке телефона.</p>';
  if(sheetMode==='expense'){
    const a=draft.amount||'';
    return head('Расход')+'<div class="amount'+(a?'':' zero')+'" id="amount" aria-live="polite">'+(a?money(Number(a)):'0\u00A0₽')+'</div><div class="cats">'+CATS.map(c=>'<button data-act="cat" data-v="'+c+'" aria-pressed="'+(draft.cat===c)+'">'+c+'</button>').join('')+'</div><div class="keys">'+['1','2','3','4','5','6','7','8','9','00','0','del'].map(k=>'<button data-act="key" data-v="'+k+'"'+(k==='del'?' aria-label="Стереть"':'')+'>'+(k==='del'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11v12H9l-6-6z"/><path d="M12 10l4 4M16 10l-4 4"/></svg>':k)+'</button>').join('')+'</div><button class="wide-btn" data-act="save-expense"'+(a?'':' disabled')+'>Записать расход</button>';
  }
  if(sheetMode==='thought')return head('Мысль')+'<label class="f" for="th">Что не хочется забыть</label><textarea class="inp" id="th" placeholder="Например: купить батарейки"></textarea><p class="hint">Начни со слова «купить», и запись уйдёт в список покупок.</p><button class="wide-btn" data-act="save-thought">Записать мысль</button>';
  if(sheetMode==='date')return head('Назначить дату')+'<p class="hint" style="margin-top:0">'+esc(draft.text||'')+'</p><label class="f" for="dd">Когда</label><input class="inp" type="date" id="dd" value="'+iso(addDays(now(),1))+'">'+repeatSelect('dr','none')+'<button class="wide-btn" data-act="save-date">Перенести в дела</button>';
  if(sheetMode==='duty')return head('Новое дело')+'<label class="f" for="dt">Что нужно сделать</label><input class="inp" type="text" id="dt" placeholder="Например: передать показания счётчиков"><label class="f" for="dd">Когда</label><input class="inp" type="date" id="dd" value="'+iso(addDays(now(),1))+'">'+repeatSelect('dr','month')+'<button class="wide-btn" data-act="save-duty">Добавить дело</button>';
  if(sheetMode==='settings')return head('Настройки')+'<p class="hint" style="margin-top:0">Ты вошёл как '+esc(user?user.email:'')+'</p><button class="wide-btn ghost" data-act="sign-out">Выйти</button>';
  return '';
}
function openSheet(mode,d){sheetMode=mode;draft=d||{};document.getElementById('sheet').innerHTML=sheetHTML();document.getElementById('shade').classList.add('open');const f=document.querySelector('#sheet textarea,#sheet input[type=text],#sheet input[type=number]');if(f)setTimeout(()=>f.focus(),60);}
function closeSheet(){sheetMode=null;document.getElementById('shade').classList.remove('open');}
function refreshSheet(){document.getElementById('sheet').innerHTML=sheetHTML();}
function key(v){let a=draft.amount||'';if(v==='del')a=a.slice(0,-1);else if(a.length+v.length<=7)a=(a+v).replace(/^0+/,'');draft.amount=a;refreshSheet();}
function advance(d){
  if(d.repeat==='none'){S.duties=S.duties.filter(x=>x.id!==d.id);run(sb.from('duties').delete().eq('id',d.id));return 'Сделано';}
  let n=parse(d.due);const step=x=>d.repeat==='week'?addDays(x,7):addMonths(x,d.repeat==='month'?1:d.repeat==='halfyear'?6:12);
  do{n=step(n);}while(n<=now());d.due=iso(n);run(sb.from('duties').update({due:d.due}).eq('id',d.id));return 'Сделано. Следующий раз '+dayMonth(n);
}

const acts={
  'open-menu':()=>openSheet('menu'),
  'open-expense':()=>openSheet('expense',{amount:'',cat:'Еда'}),
  'open-thought':()=>openSheet('thought'),
  'open-duty':()=>openSheet('duty'),
  'open-settings':()=>openSheet('settings'),
  'close':closeSheet,
  'key':el=>key(el.dataset.v),
  'cat':el=>{draft.cat=el.dataset.v;refreshSheet();},
  'sign-in':async()=>{const c=creds();if(!c)return;authMsg='Вхожу…';render();const r=await sb.auth.signInWithPassword(c);if(r.error){authMsg=/confirm/i.test(r.error.message)?'Сначала подтверди почту по ссылке из письма, потом войди.':'Не получилось войти. Проверь почту и пароль.';render();}else{authMsg='';}},
  'sign-up':async()=>{const c=creds();if(!c)return;authMsg='Создаю аккаунт…';render();const r=await sb.auth.signUp({email:c.email,password:c.password,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error){authMsg='Не получилось создать аккаунт: '+r.error.message;render();}else if(!r.data.session){authMsg='Аккаунт создан. Открой письмо от Supabase, перейди по ссылке и вернись сюда.';render();}else{authMsg='';}},
  'sign-out':async()=>{closeSheet();await sb.auth.signOut();},
  'save-expense':()=>{const a=Number(draft.amount);if(!a)return;const r={id:uid(),amount:a,cat:draft.cat,date:iso(now())};S.expenses.unshift(r);closeSheet();render();toast('Расход записан. Сегодня '+money(calc().today));run(sb.from('expenses').insert({id:r.id,amount:a,category:r.cat,spent_on:r.date}));},
  'save-thought':()=>{const raw=document.getElementById('th').value.trim();if(!raw){toast('Напиши хотя бы пару слов');return;}const m=raw.match(/^купить\s+(.+)/i);if(m){const t=m[1].charAt(0).toUpperCase()+m[1].slice(1);const r={id:uid(),text:t,done:false};S.shop.unshift(r);toast('Мысль записана в список покупок');run(sb.from('shopping').insert({id:r.id,text:t}));}else{const r={id:uid(),text:raw,created:iso(now())};S.inbox.unshift(r);toast('Мысль записана во входящие');run(sb.from('inbox').insert({id:r.id,text:raw}));}closeSheet();render();},
  'save-date':()=>{const d=document.getElementById('dd').value;if(!d){toast('Выбери дату');return;}const r={id:uid(),title:draft.text,due:d,repeat:document.getElementById('dr').value};const old=draft.id;S.duties.push(r);S.inbox=S.inbox.filter(x=>x.id!==old);closeSheet();render();toast('Перенесено в дела на '+dayMonth(parse(d)));run(sb.from('duties').insert({id:r.id,title:r.title,due:r.due,repeat_rule:r.repeat}).then(x=>x.error?x:sb.from('inbox').delete().eq('id',old)));},
  'save-duty':()=>{const t=document.getElementById('dt').value.trim(),d=document.getElementById('dd').value;if(!t||!d){toast('Нужны название и дата');return;}const r={id:uid(),title:t,due:d,repeat:document.getElementById('dr').value};S.duties.push(r);closeSheet();render();toast('Дело добавлено');run(sb.from('duties').insert({id:r.id,title:t,due:d,repeat_rule:r.repeat}));},
  'exp-del':el=>{S.expenses=S.expenses.filter(x=>x.id!==el.dataset.id);render();toast('Расход удалён');run(sb.from('expenses').delete().eq('id',el.dataset.id));},
  'inbox-tab':el=>{inboxTab=el.dataset.v;render();},
  'idea-done':el=>{S.inbox=S.inbox.filter(x=>x.id!==el.dataset.id);render();toast('Сделано');run(sb.from('inbox').delete().eq('id',el.dataset.id));},
  'idea-del':el=>{S.inbox=S.inbox.filter(x=>x.id!==el.dataset.id);render();toast('Удалено');run(sb.from('inbox').delete().eq('id',el.dataset.id));},
  'idea-date':el=>{const x=S.inbox.find(i=>i.id===el.dataset.id);if(x)openSheet('date',{id:x.id,text:x.text});},
  'shop-toggle':el=>{const x=S.shop.find(i=>i.id===el.dataset.id);if(x){x.done=!x.done;render();run(sb.from('shopping').update({done:x.done}).eq('id',x.id));}},
  'shop-del':el=>{S.shop=S.shop.filter(x=>x.id!==el.dataset.id);render();run(sb.from('shopping').delete().eq('id',el.dataset.id));},
  'duty-done':el=>{const d=S.duties.find(i=>i.id===el.dataset.id);if(d){const m=advance(d);render();toast(m);}},
  'duty-del':el=>{S.duties=S.duties.filter(x=>x.id!==el.dataset.id);render();toast('Дело удалено');run(sb.from('duties').delete().eq('id',el.dataset.id));}
};

document.addEventListener('click',e=>{
  if(e.target.id==='shade'){closeSheet();return;}
  const t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  const a=e.target.closest('[data-act]');if(a&&!a.disabled&&acts[a.dataset.act])acts[a.dataset.act](a);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetMode){closeSheet();return;}
  if(sheetMode==='expense'){if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==='Backspace')key('del');else if(e.key==='Enter')acts['save-expense']();}
});
async function boot(){
  if(!user){loading=false;render();return;}
  loading=true;render();
  try{await loadAll();}catch(e){toast('Не удалось загрузить данные. Проверь связь');}
  loading=false;render();
}
sb.auth.onAuthStateChange((ev,session)=>{const u=session?session.user:null;if(u&&user&&u.id===user.id)return;user=u;setTimeout(boot,0);});
render();
})();
</script>
</body>
</html>
